<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ISEKAI INDEX — Anime Search</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#100E17;
    --ink-2:#191622;
    --ink-3:#242032;
    --line:#332C44;
    --paper:#EFEAF6;
    --paper-dim:#B6ACC9;
    --pink:#FF3D77;
    --pink-dim:#7A2140;
    --cyan:#3FDDFF;
    --gold:#FFC857;
    --radius:14px;
    box-sizing:border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  *{box-sizing:inherit;}
  html{scroll-padding-top: env(safe-area-inset-top, 0px);}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--ink);
    color:var(--paper);
    font-family:'Inter',system-ui,-apple-system,Segoe UI,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow-x:hidden;
  }
  ::selection{background:var(--pink);color:var(--ink);}

  .display{
    font-family:'Bebas Neue',Impact,'Arial Narrow',sans-serif;
    letter-spacing:0.02em;
  }

  /* ---------- top bar ---------- */
  header.topbar{
    position:sticky; top:0; z-index:40;
    padding: calc(16px + env(safe-area-inset-top,0px)) 20px 14px;
    background:linear-gradient(180deg, var(--ink) 60%, transparent);
    display:flex; align-items:center; gap:14px;
    backdrop-filter: blur(6px);
  }
  .brand{
    font-size:26px; line-height:1; color:var(--paper); cursor:pointer;
    display:flex; align-items:baseline; gap:6px; white-space:nowrap;
  }
  .brand span{color:var(--pink);}
  .backbtn{
    display:none;
    width:38px; height:38px; border-radius:50%;
    background:var(--ink-2); border:1px solid var(--line);
    color:var(--paper); align-items:center; justify-content:center;
    font-size:18px; cursor:pointer; flex:0 0 auto;
  }
  .backbtn:active{ transform: scale(0.94); }

  /* ---------- search ---------- */
  .searchwrap{
    position:relative; flex:1; max-width:640px; margin:0 auto;
  }
  #searchInput{
    width:100%;
    background:var(--ink-2);
    border:1px solid var(--line);
    color:var(--paper);
    border-radius:999px;
    padding:11px 44px 11px 18px;
    font-size:15px;
    font-family:inherit;
    outline:none;
    transition:border-color .15s ease, background .15s ease;
  }
  #searchInput::placeholder{ color:var(--paper-dim); }
  #searchInput:focus{ border-color:var(--pink); background:var(--ink-3); }
  .search-icon{
    position:absolute; right:16px; top:50%; transform:translateY(-50%);
    color:var(--paper-dim); font-size:15px; pointer-events:none;
  }

  main{ padding: 8px 20px 64px; max-width:1180px; margin:0 auto; }

  /* ---------- hero (home only) ---------- */
  .hero{
    padding: 28px 0 22px;
    text-align:center;
  }
  .hero h1{
    margin:0 0 6px;
    font-size: clamp(38px, 9vw, 64px);
    line-height:0.95;
    color:var(--paper);
  }
  .hero h1 em{ font-style:normal; color:var(--pink); }
  .hero p{
    margin:0 auto; max-width:440px;
    color:var(--paper-dim); font-size:15px; line-height:1.5;
  }

  .section-head{
    display:flex; align-items:baseline; justify-content:space-between;
    margin: 26px 0 14px;
    gap:10px;
  }
  .section-head h2{
    margin:0; font-size:22px; font-weight:800; color:var(--paper);
  }
  .section-head small{ color:var(--paper-dim); font-size:13px; }

  /* ---------- grid / cards ---------- */
  .grid{
    display:grid;
    grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap:16px;
  }
  .card{
    cursor:pointer;
    border-radius:var(--radius);
    overflow:hidden;
    background:var(--ink-2);
    border:1px solid var(--line);
    position:relative;
    transition: transform .15s ease, border-color .15s ease;
  }
  .card:active{ transform: scale(0.97); }
  @media (hover:hover){
    .card:hover{ border-color:var(--pink); }
    .card:hover .card-title{ color:var(--pink); }
  }
  .card-art{
    position:relative;
    width:100%; aspect-ratio: 2/3;
    background:var(--ink-3);
    overflow:hidden;
  }
  .card-art img{
    width:100%; height:100%; object-fit:cover; display:block;
  }
  .score-chip{
    position:absolute; top:8px; right:8px;
    background:rgba(16,14,23,0.85);
    border:1px solid var(--gold);
    color:var(--gold);
    font-size:12px; font-weight:700;
    padding:2px 7px; border-radius:999px;
  }
  .card-body{ padding:10px 11px 12px; }
  .card-title{
    font-size:13.5px; font-weight:600; line-height:1.3;
    color:var(--paper);
    display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical;
    overflow:hidden;
    transition: color .15s ease;
  }
  .card-meta{
    margin-top:4px; font-size:11.5px; color:var(--paper-dim);
  }

  /* ---------- states ---------- */
  .state{
    text-align:center; padding:50px 20px; color:var(--paper-dim);
  }
  .state .glyph{ font-size:34px; display:block; margin-bottom:10px; }
  .skeleton{
    background:linear-gradient(100deg, var(--ink-2) 30%, var(--ink-3) 50%, var(--ink-2) 70%);
    background-size:200% 100%;
    animation: shimmer 1.2s ease-in-out infinite;
  }
  @keyframes shimmer{ 0%{background-position:200% 0;} 100%{background-position:-200% 0;} }
  .skel-card .card-art{ }
  .skel-line{ height:12px; border-radius:6px; margin-top:8px; }

  /* ---------- detail view ---------- */
  #detailView{ display:none; }
  .banner{
    position:relative;
    margin: 0 -20px;
    height: 46vh; min-height:260px; max-height:420px;
    overflow:hidden;
    background:var(--ink-2);
  }
  .banner img{
    width:100%; height:100%; object-fit:cover;
    filter:saturate(1.05);
    transform:scale(1.03);
  }
  .banner::after{
    content:"";
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(16,14,23,0.15) 0%, rgba(16,14,23,0.35) 55%, var(--ink) 100%);
  }
  .detail-head{
    display:flex; gap:20px;
    margin-top:-88px; position:relative; z-index:2;
    padding: 0 4px;
  }
  .poster{
    flex:0 0 128px; width:128px; aspect-ratio:2/3;
    border-radius:10px; overflow:hidden;
    border:2px solid var(--ink);
    box-shadow:0 10px 24px rgba(0,0,0,0.45);
    background:var(--ink-3);
  }
  .poster img{ width:100%; height:100%; object-fit:cover; display:block; }
  .detail-titles{ padding-top:34px; min-width:0; }
  .detail-titles h1{
    margin:0; font-size:clamp(22px,5.5vw,34px); line-height:1.02;
    color:var(--paper);
  }
  .detail-titles .en-title{
    margin-top:2px; font-size:13.5px; color:var(--paper-dim);
    display:-webkit-box; -webkit-line-clamp:1; -webkit-box-orient:vertical; overflow:hidden;
  }

  .stat-row{
    display:flex; flex-wrap:wrap; gap:10px;
    margin: 18px 0 4px;
  }
  .stat{
    background:var(--ink-2); border:1px solid var(--line);
    border-radius:10px; padding:9px 14px;
    min-width:78px;
  }
  .stat .num{ font-family:'Bebas Neue',sans-serif; font-size:22px; color:var(--paper); letter-spacing:0.02em; display:block; }
  .stat .num.gold{ color:var(--gold); }
  .stat .lab{ font-size:10.5px; color:var(--paper-dim); text-transform:uppercase; letter-spacing:0.06em; }

  .genres{ display:flex; flex-wrap:wrap; gap:8px; margin:16px 0 6px; }
  .genre-tag{
    font-size:12px; padding:5px 12px; border-radius:999px;
    border:1px solid var(--line); color:var(--paper-dim);
  }

  .watch-btn{
    display:inline-flex; align-items:center; gap:8px;
    background:var(--pink); color:var(--ink);
    font-weight:800; font-size:15px;
    border:none; border-radius:999px;
    padding:13px 26px; margin-top:20px;
    cursor:pointer; text-decoration:none;
    box-shadow:0 8px 22px rgba(255,61,119,0.28);
    transition:transform .12s ease, box-shadow .12s ease;
  }
  .watch-btn:active{ transform:scale(0.97); }
  .watch-btn .tri{ font-size:12px; }
  .watch-note{ margin-top:8px; font-size:12px; color:var(--paper-dim); }

  .synopsis{
    margin-top:26px; max-width:70ch;
    color:var(--paper); opacity:0.9;
    font-size:14.5px; line-height:1.65;
  }
  .synopsis h3{ font-size:13px; text-transform:uppercase; letter-spacing:0.08em; color:var(--paper-dim); margin:0 0 8px; font-weight:700; }

  a.silent, a.silent:visited{ color:inherit; text-decoration:none; }

  @media (min-width:640px){
    .banner{ margin:0 -20px; }
    main{ padding:8px 32px 72px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button class="backbtn" id="backBtn" aria-label="Back">&#8592;</button>
  <div class="brand" id="brandLink"><span>ISEKAI</span>INDEX</div>
  <div class="searchwrap">
    <input id="searchInput" type="text" placeholder="Search anime — try “Bleach” or “Frieren”" autocomplete="off">
    <span class="search-icon">&#9906;</span>
  </div>
</header>

<main>

  <section id="homeView">
    <div class="hero" id="heroBlock">
      <h1 class="display">Find your next <em>obsession.</em></h1>
      <p>Search the full Jikan / MyAnimeList catalog, or scroll what's popular right now.</p>
    </div>

    <div class="section-head">
      <h2 id="gridHeading">Popular right now</h2>
      <small id="gridSub">via MyAnimeList</small>
    </div>

    <div class="grid" id="grid"></div>
  </section>

  <section id="detailView">
    <div class="banner" id="banner"><img id="bannerImg" alt=""></div>
    <div class="detail-head">
      <div class="poster"><img id="posterImg" alt=""></div>
      <div class="detail-titles">
        <h1 class="display" id="animeTitle"></h1>
        <div class="en-title" id="animeTitleEn"></div>
      </div>
    </div>

    <div class="stat-row">
      <div class="stat"><span class="num" id="statYear">—</span><span class="lab">Released</span></div>
      <div class="stat"><span class="num gold" id="statScore">—</span><span class="lab">Rating</span></div>
      <div class="stat"><span class="num" id="statEpisodes">—</span><span class="lab">Episodes</span></div>
      <div class="stat"><span class="num" id="statStatus">—</span><span class="lab">Status</span></div>
    </div>

    <div class="genres" id="genreRow"></div>

    <div>
      <a class="watch-btn" id="watchBtn" href="#" target="_blank" rel="noopener">
        <span class="tri">&#9654;</span><span id="watchLabel">Watch now</span>
      </a>
      <div class="watch-note" id="watchNote"></div>
    </div>

    <div class="synopsis">
      <h3>Synopsis</h3>
      <p id="synopsisText"></p>
    </div>

    <div class="section-head">
      <h2>You might also like</h2>
    </div>
    <div class="grid" id="relatedGrid"></div>
  </section>

</main>

<script>
(function(){
  const API = "https://api.jikan.moe/v4";
  const grid = document.getElementById('grid');
  const relatedGrid = document.getElementById('relatedGrid');
  const homeView = document.getElementById('homeView');
  const detailView = document.getElementById('detailView');
  const searchInput = document.getElementById('searchInput');
  const backBtn = document.getElementById('backBtn');
  const brandLink = document.getElementById('brandLink');
  const heroBlock = document.getElementById('heroBlock');
  const gridHeading = document.getElementById('gridHeading');
  const gridSub = document.getElementById('gridSub');

  let searchTimer = null;
  let requestToken = 0;

  // ---------- helpers ----------
  function skeletonCards(n){
    grid.innerHTML = '';
    for(let i=0;i<n;i++){
      const c = document.createElement('div');
      c.className = 'card skel-card';
      c.innerHTML = `<div class="card-art skeleton"></div>
        <div class="card-body">
          <div class="skel-line skeleton" style="width:90%"></div>
          <div class="skel-line skeleton" style="width:50%"></div>
        </div>`;
      grid.appendChild(c);
    }
  }

  function stateMessage(el, glyph, title, sub, onRetry){
    el.innerHTML = `<div class="state"><span class="glyph">${glyph}</span><strong>${title}</strong><div style="margin-top:6px;font-size:13px;">${sub||''}</div></div>`;
    if(onRetry){
      const btn = document.createElement('button');
      btn.textContent = 'Retry';
      btn.style.cssText = 'margin-top:14px;background:var(--ink-2);border:1px solid var(--line);color:var(--paper);padding:8px 18px;border-radius:999px;font:inherit;cursor:pointer;';
      btn.addEventListener('click', onRetry);
      el.querySelector('.state').appendChild(btn);
    }
  }

  async function jikanGet(path){
    let res;
    try{
      res = await fetch(API + path);
    }catch(networkErr){
      // fetch() itself threw: DNS/CORS/offline/blocked request, not an HTTP error
      throw new Error('NETWORK: could not reach api.jikan.moe (' + networkErr.message + ')');
    }
    if(!res.ok) throw new Error('HTTP ' + res.status + ' from Jikan');
    const json = await res.json();
    return json.data;
  }

  function scoreOf(a){ return a.score ? a.score.toFixed(1) : '—'; }
  function yearOf(a){ return a.year || (a.aired && a.aired.prop && a.aired.prop.from && a.aired.prop.from.year) || '—'; }

  function renderCards(container, list){
    container.innerHTML = '';
    if(!list || !list.length){
      stateMessage(container, '&#128269;', 'No results', 'Try a different title or spelling.');
      return;
    }
    list.forEach(anime => {
      const img = (anime.images && (anime.images.jpg.large_image_url || anime.images.jpg.image_url)) || '';
      const card = document.createElement('div');
      card.className = 'card';
      card.innerHTML = `
        <div class="card-art"><img src="${img}" alt="" loading="lazy"></div>
        <div class="card-body">
          <div class="card-title">${anime.title || anime.title_english || 'Untitled'}</div>
          <div class="card-meta">${yearOf(anime)} · ${anime.type || 'TV'}</div>
        </div>
        ${anime.score ? `<span class="score-chip">&#9733; ${scoreOf(anime)}</span>` : ''}
      `;
      card.addEventListener('click', () => openDetail(anime.mal_id));
      container.appendChild(card);
    });
  }

  // ---------- home: popular ----------
  async function loadPopular(){
    skeletonCards(12);
    gridHeading.textContent = 'Popular right now';
    gridSub.textContent = 'via MyAnimeList';
    try{
      const data = await jikanGet('/top/anime?filter=bypopularity&limit=18');
      renderCards(grid, data);
    }catch(e){
      stateMessage(grid, '&#9888;', "Couldn't load popular anime", 'Error: ' + e.message, loadPopular);
    }
  }

  // ---------- search ----------
  async function runSearch(q){
    const myToken = ++requestToken;
    gridHeading.textContent = `Results for “${q}”`;
    gridSub.textContent = '';
    skeletonCards(12);
    try{
      const data = await jikanGet('/anime?q=' + encodeURIComponent(q) + '&limit=18&sfw=true');
      if(myToken !== requestToken) return; // stale response, a newer search superseded it
      renderCards(grid, data);
    }catch(e){
      if(myToken !== requestToken) return;
      stateMessage(grid, '&#9888;', 'Search failed', 'Error: ' + e.message, () => runSearch(q));
    }
  }

  searchInput.addEventListener('input', (e) => {
    const q = e.target.value.trim();
    clearTimeout(searchTimer);
    if(!q){
      showHome();
      loadPopular();
      return;
    }
    showHome();
    heroBlock.style.display = 'none';
    searchTimer = setTimeout(() => runSearch(q), 400); // debounce so we don't hammer Jikan's rate limit
  });

  // ---------- routing ----------
  function showHome(){
    detailView.style.display = 'none';
    homeView.style.display = 'block';
    backBtn.style.display = 'none';
  }
  function showDetail(){
    homeView.style.display = 'none';
    detailView.style.display = 'block';
    backBtn.style.display = 'flex';
    window.scrollTo(0,0);
  }

  backBtn.addEventListener('click', () => {
    showHome();
    heroBlock.style.display = '';
    searchInput.value = '';
    gridHeading.textContent = 'Popular right now';
    gridSub.textContent = 'via MyAnimeList';
    loadPopular();
  });
  brandLink.addEventListener('click', () => backBtn.click());

  // ---------- detail page ----------
  async function openDetail(id){
    showDetail();
    document.getElementById('animeTitle').textContent = 'Loading…';
    document.getElementById('animeTitleEn').textContent = '';
    document.getElementById('synopsisText').textContent = '';
    document.getElementById('genreRow').innerHTML = '';
    document.getElementById('bannerImg').src = '';
    document.getElementById('posterImg').src = '';
    ['statYear','statScore','statEpisodes','statStatus'].forEach(id2 => document.getElementById(id2).textContent = '—');
    relatedGrid.innerHTML = '';

    try{
      const a = await jikanGet('/anime/' + id + '/full');
      const img = (a.images && (a.images.jpg.large_image_url || a.images.jpg.image_url)) || '';

      document.getElementById('bannerImg').src = img;
      document.getElementById('posterImg').src = img;
      document.getElementById('animeTitle').textContent = a.title || 'Untitled';
      document.getElementById('animeTitleEn').textContent = (a.title_english && a.title_english !== a.title) ? a.title_english : '';

      document.getElementById('statYear').textContent = yearOf(a);
      document.getElementById('statScore').textContent = scoreOf(a);
      document.getElementById('statEpisodes').textContent = a.episodes || '—';
      document.getElementById('statStatus').textContent = a.status ? a.status.replace('Currently Airing','Airing').replace('Finished Airing','Finished') : '—';

      const genreRow = document.getElementById('genreRow');
      (a.genres || []).concat(a.themes || []).slice(0,6).forEach(g => {
        const tag = document.createElement('span');
        tag.className = 'genre-tag';
        tag.textContent = g.name;
        genreRow.appendChild(tag);
      });

      document.getElementById('synopsisText').textContent = a.synopsis || 'No synopsis available yet.';

      // Watch now: Jikan has no legal streaming links, so point to the best
      // available official source — trailer first, otherwise the MAL page.
      const watchBtn = document.getElementById('watchBtn');
      const watchNote = document.getElementById('watchNote');
      if(a.trailer && a.trailer.url){
        watchBtn.href = a.trailer.url;
        document.getElementById('watchLabel').textContent = 'Watch trailer';
        watchNote.textContent = 'No streaming link from this API — opens the official trailer on YouTube.';
      } else if(a.url){
        watchBtn.href = a.url;
        document.getElementById('watchLabel').textContent = 'View on MyAnimeList';
        watchNote.textContent = 'No trailer or streaming link available for this title.';
      } else {
        watchBtn.removeAttribute('href');
        watchNote.textContent = '';
      }

      loadRelated(id);
    }catch(e){
      document.getElementById('animeTitle').textContent = "Couldn't load this title";
      document.getElementById('synopsisText').textContent = 'Jikan API might be rate-limited or offline — try again in a moment.';
    }
  }

  async function loadRelated(id){
    try{
      const recs = await jikanGet('/anime/' + id + '/recommendations');
      const list = (recs || []).slice(0,12).map(r => r.entry);
      renderCards(relatedGrid, list);
    }catch(e){
      relatedGrid.innerHTML = '';
    }
  }

  // ---------- boot ----------
  loadPopular();
})();
</script>
</body>
</html>
