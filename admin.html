<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel — Captured Photos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0f0f13;--surface:#1a1a22;--surface-hover:#22222e;--border:#2a2a38;--border-light:#353545;--text:#e8e8f0;--text-muted:#8888a0;--text-dim:#55556a;--accent:#6366f1;--accent-hover:#818cf8;--danger:#ef4444;--success:#22c55e;}
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{min-height:100%;background:var(--bg);font-family:'Inter',sans-serif;color:var(--text);font-size:14px;}

  #passwordOverlay{position:fixed;inset:0;background:var(--bg);z-index:999;display:flex;align-items:center;justify-content:center;flex-direction:column;padding:24px;text-align:center;}
  #passwordOverlay.hidden{display:none;}
  .pw-card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:48px 40px;max-width:380px;width:100%;box-shadow:0 20px 60px rgba(0,0,0,.5);}
  .pw-card .lock-icon{width:48px;height:48px;margin:0 auto 24px;background:var(--accent);border-radius:12px;display:flex;align-items:center;justify-content:center;}
  .pw-card .lock-icon svg{width:24px;height:24px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .pw-card h2{font-size:1.4rem;font-weight:600;margin-bottom:6px;color:var(--text);}
  .pw-card p{font-size:.85rem;color:var(--text-muted);margin-bottom:28px;}
  .pw-card input{width:100%;background:var(--bg);border:1px solid var(--border);border-radius:8px;padding:12px 16px;font-family:'Inter',sans-serif;font-size:.95rem;color:var(--text);letter-spacing:.1em;text-align:center;outline:none;transition:border-color .2s,box-shadow .2s;}
  .pw-card input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(99,102,241,.15);}
  .pw-card input::placeholder{color:var(--text-dim);letter-spacing:.05em;}
  .pw-card button{width:100%;margin-top:16px;font-family:'Inter',sans-serif;font-size:.9rem;font-weight:500;background:var(--accent);color:#fff;border:none;padding:12px;border-radius:8px;cursor:pointer;transition:background .2s,transform .1s;}
  .pw-card button:hover{background:var(--accent-hover);}
  .pw-card button:active{transform:scale(.98);}
  .pw-error{margin-top:12px;font-size:.8rem;color:var(--danger);opacity:0;transition:opacity .2s;min-height:18px;}
  .pw-error.show{opacity:1;}

  #adminDashboard{display:none;}
  #adminDashboard.show{display:block;}

  .topbar{background:var(--surface);border-bottom:1px solid var(--border);padding:16px 32px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:50;}
  .topbar .brand{display:flex;align-items:center;gap:12px;}
  .topbar .brand .logo{width:36px;height:36px;background:var(--accent);border-radius:8px;display:flex;align-items:center;justify-content:center;}
  .topbar .brand .logo svg{width:20px;height:20px;stroke:#fff;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .topbar .brand h1{font-size:1.1rem;font-weight:600;color:var(--text);}
  .topbar .brand h1 span{display:block;font-size:.7rem;font-weight:400;color:var(--text-muted);letter-spacing:.05em;text-transform:uppercase;}
  .topbar .actions{display:flex;gap:10px;align-items:center;}
  .btn{font-family:'Inter',sans-serif;font-size:.8rem;font-weight:500;padding:8px 16px;border-radius:6px;cursor:pointer;border:none;transition:all .2s;display:inline-flex;align-items:center;gap:6px;}
  .btn-primary{background:var(--accent);color:#fff;}
  .btn-primary:hover{background:var(--accent-hover);}
  .btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border);}
  .btn-ghost:hover{background:var(--surface-hover);color:var(--text);}
  .btn-danger{background:transparent;color:var(--danger);border:1px solid rgba(239,68,68,.3);}
  .btn-danger:hover{background:rgba(239,68,68,.1);}

  .main{max-width:1400px;margin:0 auto;padding:28px 32px 60px;}
  .stats-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px;margin-bottom:28px;}
  .stat-card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:20px 22px;display:flex;align-items:center;gap:14px;}
  .stat-card .icon{width:40px;height:40px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex-shrink:0;}
  .stat-card .icon.purple{background:rgba(99,102,241,.12);}
  .stat-card .icon.purple svg{stroke:var(--accent);}
  .stat-card .icon.green{background:rgba(34,197,94,.12);}
  .stat-card .icon.green svg{stroke:var(--success);}
  .stat-card .icon svg{width:20px;height:20px;stroke-width:2;fill:none;stroke-linecap:round;stroke-linejoin:round;}
  .stat-card .data h3{font-size:1.4rem;font-weight:600;color:var(--text);line-height:1;}
  .stat-card .data p{font-size:.75rem;color:var(--text-muted);margin-top:4px;text-transform:uppercase;letter-spacing:.06em;}

  .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px;}
  .section-header h2{font-size:1rem;font-weight:600;color:var(--text);}
  .section-header p{font-size:.8rem;color:var(--text-muted);}

  .photo-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;}
  .photo-item{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden;transition:border-color .2s,transform .2s;animation:fadeUp .4s ease forwards;opacity:0;}
  .photo-item:hover{border-color:var(--border-light);transform:translateY(-2px);}
  @keyframes fadeUp{from{opacity:0;transform:translateY(10px);}to{opacity:1;transform:translateY(0);}}
  .photo-item .thumb{position:relative;width:100%;padding-top:70%;background:var(--bg);overflow:hidden;cursor:pointer;}
  .photo-item .thumb img{position:absolute;top:0;left:0;width:100%;height:100%;object-fit:cover;transition:transform .3s;}
  .photo-item:hover .thumb img{transform:scale(1.04);}
  .photo-item .thumb .ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--text-dim);font-size:.75rem;}
  .photo-item .meta{padding:14px 16px;}
  .photo-item .meta .time{font-size:.78rem;color:var(--text-muted);margin-bottom:4px;}
  .photo-item .meta .fname{font-size:.7rem;color:var(--text-dim);word-break:break-all;margin-bottom:12px;}
  .photo-item .meta .row{display:flex;gap:8px;}
  .photo-item .meta .row .btn{flex:1;justify-content:center;padding:6px 0;font-size:.75rem;}

  .empty{grid-column:1 / -1;text-align:center;padding:80px 20px;color:var(--text-muted);}
  .empty svg{width:56px;height:56px;stroke:var(--text-dim);margin-bottom:16px;}
  .empty h3{font-size:1.1rem;font-weight:500;color:var(--text);margin-bottom:6px;}
  .empty p{font-size:.85rem;}
  .loading{grid-column:1 / -1;text-align:center;padding:60px;}
  .loading .spinner{width:36px;height:36px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto 12px;}
  @keyframes spin{to{transform:rotate(360deg);}}
  .loading p{color:var(--text-muted);font-size:.85rem;}
  .error{grid-column:1 / -1;text-align:center;padding:60px 20px;color:var(--danger);}

  #lightbox{display:none;position:fixed;inset:0;background:rgba(15,15,19,.96);z-index:300;align-items:center;justify-content:center;padding:24px;}
  #lightbox.show{display:flex;}
  #lightbox img{max-width:92vw;max-height:88vh;border-radius:8px;box-shadow:0 20px 60px rgba(0,0,0,.6);}
  #lightbox .lb-close{position:absolute;top:16px;right:20px;background:rgba(255,255,255,.08);border:1px solid var(--border);color:var(--text);width:40px;height:40px;border-radius:8px;font-size:1.4rem;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s;}
  #lightbox .lb-close:hover{background:rgba(255,255,255,.15);}
  @media(max-width:600px){.topbar{padding:14px 16px;}.main{padding:20px 16px 40px;}.pw-card{padding:36px 24px;}}
</style>
</head>
<body>

<div id="passwordOverlay">
  <div class="pw-card">
    <div class="lock-icon">
      <svg viewBox="0 0 24 24"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
    </div>
    <h2>Admin Access</h2>
    <p>Enter password to view captured photos</p>
    <input type="password" id="pwInput" placeholder="Enter password" autocomplete="off">
    <button id="pwBtn">Unlock Dashboard</button>
    <p class="pw-error" id="pwError">Incorrect password. Try again.</p>
  </div>
</div>

<div id="adminDashboard">
  <div class="topbar">
    <div class="brand">
      <div class="logo">
        <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
      </div>
      <h1>Admin Panel <span>Prank Photos</span></h1>
    </div>
    <div class="actions">
      <button class="btn btn-primary" id="refreshBtn">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        Refresh
      </button>
      <button class="btn btn-ghost" id="logoutBtn">Logout</button>
    </div>
  </div>
  <div class="main">
    <div class="stats-row">
      <div class="stat-card">
        <div class="icon purple">
          <svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/></svg>
        </div>
        <div class="data"><h3 id="totalCount">0</h3><p>Total Photos</p></div>
      </div>
      <div class="stat-card">
        <div class="icon green">
          <svg viewBox="0 0 24 24"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>
        </div>
        <div class="data"><h3 id="statusText">Live</h3><p>Connection</p></div>
      </div>
    </div>
    <div class="section-header">
      <h2>Captured Photos</h2>
      <p id="showingText">0 photos found</p>
    </div>
    <div class="photo-grid" id="photoGrid">
      <div class="loading" id="loader"><div class="spinner"></div><p>Loading from Firebase...</p></div>
      <div class="error" id="errorMsg" style="display:none;"><p>Failed to load photos. Check Firebase rules.</p></div>
    </div>
  </div>
</div>

<div id="lightbox">
  <button class="lb-close" id="lbClose">&times;</button>
  <img id="lbImg" src="" alt="Full size">
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<script>
  // Initialize Firebase
  let db, storage;
  try {
    const firebaseConfig = {
      apiKey: "AIzaSyCX92t8ikO3quelLUs75AMLWBrqHfadmho",
      authDomain: "hema-8c796.firebaseapp.com",
      databaseURL: "https://hema-8c796-default-rtdb.firebaseio.com",
      projectId: "hema-8c796",
      storageBucket: "hema-8c796.firebasestorage.app",
      messagingSenderId: "867852613638",
      appId: "1:867852613638:web:ab2b51543db60ab2da6b87",
      measurementId: "G-08M4RV75T9"
    };
    firebase.initializeApp(firebaseConfig);
    db = firebase.database();
    storage = firebase.storage();
    console.log('Firebase OK');
  } catch(e) {
    console.error('Firebase init failed:', e);
    alert('Firebase failed: ' + e.message);
  }

  const CORRECT_PASSWORD = 'ASIF2008';
  const passwordOverlay = document.getElementById('passwordOverlay');
  const adminDashboard = document.getElementById('adminDashboard');
  const pwInput = document.getElementById('pwInput');
  const pwBtn = document.getElementById('pwBtn');
  const pwError = document.getElementById('pwError');
  const logoutBtn = document.getElementById('logoutBtn');
  const photoGrid = document.getElementById('photoGrid');
  const loader = document.getElementById('loader');
  const errorMsg = document.getElementById('errorMsg');
  const totalCount = document.getElementById('totalCount');
  const showingText = document.getElementById('showingText');
  const refreshBtn = document.getElementById('refreshBtn');
  const lightbox = document.getElementById('lightbox');
  const lbImg = document.getElementById('lbImg');
  const lbClose = document.getElementById('lbClose');
  let unsubscribe = null;

  if(sessionStorage.getItem('adminAuth') === 'true') unlockDashboard();

  function unlockDashboard(){
    passwordOverlay.classList.add('hidden');
    adminDashboard.classList.add('show');
    sessionStorage.setItem('adminAuth','true');
    loadPhotos();
  }
  function lockDashboard(){
    sessionStorage.removeItem('adminAuth');
    passwordOverlay.classList.remove('hidden');
    adminDashboard.classList.remove('show');
    pwInput.value = ''; pwError.classList.remove('show');
    if(unsubscribe){ unsubscribe(); unsubscribe = null; }
  }
  function checkPassword(){
    if(pwInput.value === CORRECT_PASSWORD){ unlockDashboard(); }
    else { pwError.classList.add('show'); pwInput.value = ''; pwInput.focus(); }
  }
  pwBtn.addEventListener('click', checkPassword);
  pwInput.addEventListener('keydown', e => { if(e.key === 'Enter') checkPassword(); });
  logoutBtn.addEventListener('click', lockDashboard);

  function formatDate(isoString){
    if(!isoString) return 'Unknown date';
    const d = new Date(isoString);
    return d.toLocaleString('en-IN', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit',hour12:true});
  }

  function renderPhotos(data){
    photoGrid.innerHTML = '';
    if(!data || Object.keys(data).length === 0){
      photoGrid.innerHTML = `
        <div class="empty">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/><circle cx="8.5" cy="8.5" r="1.5"/><polyline points="21 15 16 10 5 21"/>
          </svg>
          <h3>No photos yet</h3>
          <p>Photos captured from the user panel will appear here.</p>
        </div>`;
      totalCount.textContent = '0';
      showingText.textContent = '0 photos found';
      return;
    }
    const entries = Object.entries(data).sort((a,b) => (b[1].timestamp || 0) - (a[1].timestamp || 0));
    totalCount.textContent = entries.length;
    showingText.textContent = entries.length + ' photo' + (entries.length !== 1 ? 's' : '') + ' found';

    entries.forEach(([key, photo], index) => {
      const item = document.createElement('div');
      item.className = 'photo-item';
      item.style.animationDelay = (index * 0.04) + 's';
      item.innerHTML = `
        <div class="thumb" data-url="${photo.imageUrl || ''}">
          <img src="${photo.imageUrl || ''}" alt="Captured" loading="lazy" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
          <div class="ph" style="display:none;">Failed to load</div>
        </div>
        <div class="meta">
          <div class="time">${formatDate(photo.date)}</div>
          <div class="fname">${photo.filename || 'unknown.png'}</div>
          <div class="row">
            <button class="btn btn-primary view-btn" data-url="${photo.imageUrl || ''}">View</button>
            <button class="btn btn-danger del-btn" data-key="${key}" data-filename="${photo.filename || ''}">Delete</button>
          </div>
        </div>`;
      photoGrid.appendChild(item);
    });

    photoGrid.querySelectorAll('.thumb, .view-btn').forEach(el => {
      el.addEventListener('click', () => {
        const url = el.dataset.url || el.closest('.photo-item').querySelector('.thumb').dataset.url;
        if(url){ lbImg.src = url; lightbox.classList.add('show'); }
      });
    });
    photoGrid.querySelectorAll('.del-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        if(!confirm('Delete this photo permanently?')) return;
        const key = btn.dataset.key; const filename = btn.dataset.filename;
        btn.textContent = '...'; btn.disabled = true;
        try {
          await db.ref('prank_photos/' + key).remove();
          if(filename){ await storage.ref('prank_photos/' + filename).delete().catch(()=>{}); }
        } catch(err) {
          alert('Delete failed: ' + err.message);
          btn.textContent = 'Delete'; btn.disabled = false;
        }
      });
    });
  }

  function loadPhotos(){
    if(unsubscribe){ unsubscribe(); }
    loader.style.display = 'block';
    errorMsg.style.display = 'none';
    photoGrid.innerHTML = '';
    photoGrid.appendChild(loader);
    photoGrid.appendChild(errorMsg);

    const photosRef = db.ref('prank_photos');
    unsubscribe = photosRef.on('value', (snapshot) => {
      loader.style.display = 'none';
      renderPhotos(snapshot.val());
    }, (err) => {
      loader.style.display = 'none';
      errorMsg.style.display = 'block';
      console.error('Firebase error:', err);
    });
  }

  refreshBtn.addEventListener('click', loadPhotos);
  lbClose.addEventListener('click', () => { lightbox.classList.remove('show'); lbImg.src = ''; });
  lightbox.addEventListener('click', e => { if(e.target === lightbox){ lightbox.classList.remove('show'); lbImg.src = ''; } });
</script>

</body>
  </html>
